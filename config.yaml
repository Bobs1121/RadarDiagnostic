ai:

  # 本地 Ollama 模型（简单任务）— 可选: qwen3:14b, gemma4:26b, gemma4:latest

  local:

    base_url: "${LOCAL_BASE_URL:-http://localhost:11434/v1}"

    api_key: "${LOCAL_API_KEY:-ollama}"

    model: "qwen2.5:7b"

  # 远端服务器模型（复杂推理任务）

  remote:

    base_url: "${REMOTE_BASE_URL}"

    api_key: "${REMOTE_API_KEY}"

    model: "Qwen3.5-27B-FP16"

  # Coder 模型 — 编码专用（代码生成/重构/审查）

  # 注意: 单 GPU 跑满，KV cache 有限，max_tokens 控制在 2000 以内

  coder:

    base_url: "${CODER_BASE_URL:-http://10.190.161.39:8080/v1}"

    api_key: "${CODER_API_KEY:-ollama}"

    model: "${CODER_MODEL:-qwen3-coder:30b}"

    max_tokens: 2000

  # 思考模式 — Qwen3.5 专属能力

  # "off"    : 全部关闭（最快，日常诊断推荐）

  # "synth"  : 仅 Round 3 综合收敛开启（平衡：质量↑ 耗时略增）

  # "full"   : 所有 complex 调用开启（最慢，token 消耗 3-5x，深度分析用）

  thinking: "full"



  # ── Variable Query Probe（Phase 3.57）───────────────────────────────────

  # 诊断时让 AI 根据「问题 + L6 代码知识」规划要查哪些变量/表达式，

  # 再由 DataProbe 在 SQLite 上执行统计查询，把结果注入 Expert Panel prompt。

  # 这是"按需证据采集"机制，避免把单点调查经验硬编码进分析流水线。

  variable_probe:

    enabled: true

    max_queries: 6        # planner 最多产出几条查询

    max_chars: 6000       # 渲染进 prompt 的最大字符数

    use_thinking: false   # planner 是轻量任务，默认不开 thinking



# ─── Identity Hierarchy (variant / package_profile / snapshot) ────────

#

# NEW: The five-layer identity model replaces the flat project_key.

#   platforms.*       → PlatformFamily (tech plugin)

#   codebases.*       → Codebase (physical workspace)

#   variants.*        → Variant (customer project boundary)

#   package_profiles* → PackageProfile (build parameter combo)

#

# LEGACY: `projects.*` is still supported for backward compatibility.

#   On load, legacy projects are automatically mapped to variants.

#   New configurations should use the identity hierarchy below.

#

# CLI:

#   Legacy:  python cli.py -P gwm_b26 <case_dir>   (project_key mode)

#   New:     python cli.py --variant gen6/gwm_b26 <case_dir>

#   Full:    python cli.py --variant gen6/gwm_b26 --package gen6/gwm_b26/default <case_dir>



